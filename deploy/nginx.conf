server {
    listen 80;
    server_name platform.example.com;

    root /var/www/platform/landing;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location /world/ {
        alias /var/www/platform/worldmonitor/dist/;
        try_files $uri $uri/ /world/index.html;
    }

    location /world/api/ {
        proxy_pass http://127.0.0.1:8787/;   # set to WM's real server port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /gev/ {
        alias /var/www/platform/gods-eye-view/dist/;
        try_files $uri $uri/ /gev/index.html;
    }

    location /gev/api/ {
        proxy_pass http://127.0.0.1:4173/;   # set to GEV's real server port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
